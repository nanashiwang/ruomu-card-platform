name: ruomu-card-platform

services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      user:
        condition: service_healthy
      admin:
        condition: service_healthy
    environment:
      USER_DOMAIN: ${USER_DOMAIN:?请配置用户站域名}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?请配置管理站域名}
      API_DOMAIN: ${API_DOMAIN:?请配置 API 域名}
      # 仅供部署校验，不会自动写入数据库中的支付渠道。
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:?请配置支付宝异步通知地址}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:?请配置支付宝同步返回地址}
      NGINX_ENVSUBST_FILTER: '^(USER_DOMAIN|ADMIN_DOMAIN|API_DOMAIN)$'
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/snippets/proxy-headers.conf:ro
      - ./nginx/api-locations.conf:/etc/nginx/snippets/api-locations.conf:ro
      - type: bind
        source: ${TLS_CERT_DIR:?请配置 TLS 证书目录的绝对路径}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["sh", "-ec", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请配置 Redis 密码}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
      args:
        APP_VERSION: ${APP_VERSION:-ruomu-local}
    command: ["./ruomu-api", "-mode", "all"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?请配置 APP_SECRET_KEY}
      APP_TOTP_ISSUER: ${APP_TOTP_ISSUER:-若木云卡}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: release
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?请配置 USER_JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      BOOTSTRAP_DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?请配置初始管理员用户名}
      BOOTSTRAP_DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?请配置初始管理员密码}
      DATABASE_DRIVER: ${DATABASE_DRIVER:-sqlite}
      DATABASE_DSN: ${DATABASE_DSN:-/app/db/ruomu.db}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
      REDIS_PREFIX: ${REDIS_PREFIX:-ruomu}
      QUEUE_ENABLED: "true"
      QUEUE_HOST: redis
      QUEUE_PORT: "6379"
      QUEUE_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
    volumes:
      - api-db:/app/db
      - api-uploads:/app/uploads
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  user:
    build:
      context: ../apps/user
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    build:
      context: ../apps/admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  api-db:
  api-uploads:
  api-logs:
