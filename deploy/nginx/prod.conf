# 此文件由官方 nginx 镜像仅替换三个 DOMAIN 变量；保留 Nginx 的 $host/$request_uri。
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:TLS:10m;
ssl_session_tickets off;
client_max_body_size 12m;

# 不记录支付宝同步返回中的签名及订单 query。
log_format ruomu '$remote_addr $host [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log ruomu;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 80;
    server_name ${USER_DOMAIN} ${ADMIN_DOMAIN} ${API_DOMAIN};
    # POST 的方法和请求体不会被 308 改写；notify_url 仍必须直接填写 HTTPS。
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${USER_DOMAIN};
    ssl_certificate /etc/nginx/tls/${USER_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/${USER_DOMAIN}/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/api-locations.conf;
    location = /sitemap.xml {
        set $backend http://api:8080;
        proxy_pass $backend$request_uri;
    }
    location = /robots.txt {
        set $backend http://api:8080;
        proxy_pass $backend$request_uri;
    }
    # /pay 及其查询参数原样交给用户 SPA。
    location / {
        set $backend http://user:80;
        proxy_pass $backend$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${ADMIN_DOMAIN};
    ssl_certificate /etc/nginx/tls/${ADMIN_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/${ADMIN_DOMAIN}/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/api-locations.conf;
    location / {
        set $backend http://admin:80;
        proxy_pass $backend$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${API_DOMAIN};
    ssl_certificate /etc/nginx/tls/${API_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/${API_DOMAIN}/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/proxy-headers.conf;
    location / {
        set $backend http://api:8080;
        proxy_pass $backend$request_uri;
    }
}
